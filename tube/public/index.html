<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Underground Live</title>
<meta name="description" content="The London Underground, live: every train, reconstructed from TfL arrival predictions.">
<meta name="theme-color" content="#101114">
<!-- Home-screen app (iOS + Android) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tube Live">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<!-- Paint the right background immediately, before the stylesheet and map load (no white flash). -->
<style>html{background:#f4f3ef}@media (prefers-color-scheme:dark){html:not([data-theme=light]){background:#101114}}html[data-theme=dark]{background:#101114}</style>
<script>try{var t=localStorage.getItem('tube-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
<link rel="stylesheet" href="style.css">
<link rel="modulepreload" href="model.js">
</head>
<body>
<canvas id="map" aria-label="Live map of the London Underground"></canvas>

<div class="hud controls" id="controls">
  <div class="seg" role="group" aria-label="Layout">
    <button data-layout="schematic" class="on">Schematic</button>
    <button data-layout="geo">Geographic</button>
  </div>
  <div class="stack">
    <button id="layout-btn" class="icon" title="Schematic / geographic" aria-label="Switch between schematic and geographic layout">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M2.5 5l5-2 5 2 5-2v12l-5 2-5-2-5 2z"/><path d="M7.5 3v12M12.5 5v12"/></svg>
    </button>
    <button id="theme" class="icon" title="Light / dark" aria-label="Toggle light or dark theme">
      <svg viewBox="0 0 20 20" width="18" height="18"><path d="M10 2.75a7.25 7.25 0 0 0 0 14.5z" fill="currentColor"/><circle cx="10" cy="10" r="7.25" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
    <button id="fit" class="icon" title="Show whole network" aria-label="Show the whole network">
      <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M3 7.5V3h4.5M17 7.5V3h-4.5M3 12.5V17h4.5M17 12.5V17h-4.5"/></svg>
    </button>
  </div>
</div>

<aside class="sheet" id="sheet" aria-label="Underground Live">
  <div class="grab" aria-hidden="true"><i></i></div>
  <div class="sheet-top" id="sheet-top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true"><path d="M-10 50h120" stroke="#E32017" stroke-width="12"/><path d="M26-10v36l24 24v60" stroke="#0098D4" stroke-width="12" fill="none" stroke-linejoin="round"/><path d="M74-10v36L50 50 26 74h-36" stroke="#FFD300" stroke-width="12" fill="none" stroke-linejoin="round"/><circle cx="50" cy="50" r="14" fill="var(--bg)" stroke="var(--fg)" stroke-width="6"/></svg>
      <span class="title">Underground</span>
      <button class="live" id="live" type="button"><i class="dot"></i><span id="live-text">Connecting…</span></button>
    </div>
    <label class="search">
      <svg viewBox="0 0 20 20" width="17" height="17" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg>
      <input id="q" type="search" placeholder="Search stations" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Search stations">
    </label>
  </div>
  <div class="sheet-body" id="sheet-body"></div>
</aside>

<div class="tip" id="tip" hidden></div>
<footer class="hud note" id="note">Positions estimated from TfL arrival predictions · Data: TfL Open Data</footer>

<script type="module" src="app.js"></script>
</body>
</html>
